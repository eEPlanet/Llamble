# Run by hand (Actions → Clean up old releases → Run workflow): deletes every release, tag and
# branch that isn't the current main, and every past build except the current code's,
# so only the newest code, its release and its build remain.
name: Clean up old releases
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old releases, tags, branches and past builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R: ${{ github.repository }}
        run: |
          head=$(gh api "repos/$R/commits/main" --jq .sha)
          for t in $(gh api "repos/$R/tags?per_page=100" --paginate --jq ".[] | select(.commit.sha != \"$head\") | .name"); do
            id=$(gh api "repos/$R/releases/tags/$t" --jq .id 2>/dev/null) && gh api -X DELETE "repos/$R/releases/$id" && echo "deleted release $t"
            gh api -X DELETE "repos/$R/git/refs/tags/$t" && echo "deleted tag $t"
          done
          for b in $(gh api "repos/$R/branches?per_page=100" --jq '.[].name'); do
            [ "$b" != main ] && gh api -X DELETE "repos/$R/git/refs/heads/$b" && echo "deleted branch $b"
          done
          for id in $(gh api "repos/$R/actions/runs?per_page=100" --paginate --jq ".workflow_runs[] | select(.id != ${{ github.run_id }} and .head_sha != \"$head\") | .id"); do
            gh api -X DELETE "repos/$R/actions/runs/$id" && echo "deleted build $id"
          done
          true
